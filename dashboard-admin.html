<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Panel Eko Bot</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #161b22; padding: 25px; border-radius: 12px; border: 1px solid #30363d; }
        h2 { color: #58a6ff; margin-top: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #30363d; font-size: 14px; }
        th { background: #21262d; color: #f0f6fc; }
        .btn-acc { background: #238636; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-acc:hover { background: #2ea043; }
        .status-pending { color: #d29922; font-weight: bold; }
        .status-active { color: #3fb950; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Command Center - Admin Dashboard</h2>
        <p>Antrean verifikasi member baru secara real-time dari Firebase:</p>
        
        <table>
            <thead>
                <tr>
                    <th>Nama Lengkap</th>
                    <th>Email</th>
                    <th>Status</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="adminTableBody">
                <tr><td colspan="4" style="text-align: center;">Memuat data...</td></tr>
            </tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB-40LEvhNDOT73mPYYxgIW7fJR4IMfqXU",
            authDomain: "panelekodb.firebaseapp.com",
            projectId: "panelekodb",
            storageBucket: "panelekodb.firebasestorage.app",
            messagingSenderId: "1047356348440",
            appId: "1:1047356348440:web:804cbf2239f07ec8aa0b6d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Ambil data secara real-time
        const tbody = document.getElementById('adminTableBody');
        onSnapshot(collection(db, "users"), (snapshot) => {
            let rows = "";
            let hasPending = false;

            snapshot.forEach((docSnap) => {
                const user = docSnap.data();
                const id = docSnap.id;

                if (user.status === "pending") {
                    hasPending = true;
                    rows += `<tr>
                        <td>${user.name}</td>
                        <td>${user.email}</td>
                        <td><span class="status-pending">PENDING</span></td>
                        <td><button class="btn-acc" onclick="accUser('${id}')">ACC</button></td>
                    </tr>`;
                }
            });

            if (!hasPending) {
                rows = `<tr><td colspan="4" style="text-align: center; color: #8b949e;">Tidak ada antrean pendaftaran saat ini.</td></tr>`;
            }
            tbody.innerHTML = rows;
        });

        // Fungsi ACC Global
        window.accUser = async function(id) {
            try {
                const userRef = doc(db, "users", id);
                await updateDoc(userRef, { status: "active" });
                alert("Berhasil melakukan ACC pada member!");
            } catch (error) {
                alert("Gagal ACC: " + error.message);
            }
        };
    </script>
</body>
</html>
