<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Member | Panel Eko</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(6, 182, 212, 0.2);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-4">

    <div class="glass-card w-full max-w-md p-8 rounded-2xl relative overflow-hidden">
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-cyan-600 rounded-full filter blur-[60px] opacity-20 pointer-events-none"></div>

        <div class="text-center mb-8">
            <h2 class="text-2xl font-black text-white tracking-wider">MEMBER LOGIN</h2>
            <p class="text-xs text-cyan-400 mt-1 uppercase tracking-widest">Panel Eko User Portal</p>
        </div>

        <!-- KOTAK NOTIFIKASI WARNING BERKEDIP (TERSEMBUNYI SECARA DEFAULT) -->
        <div id="bannedNotification" class="hidden mb-5 p-4 bg-rose-950/90 border border-rose-500 rounded-xl flex items-center gap-3 animate-pulse shadow-[0_0_20px_rgba(244,63,94,0.4)]">
            <div class="w-8 h-8 rounded-full bg-rose-600 flex items-center justify-center flex-shrink-0 animate-bounce">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                </svg>
            </div>
            <p id="bannedText" class="text-xs font-bold text-rose-200 leading-relaxed uppercase tracking-wide"></p>
        </div>

        <form id="loginUserForm" class="space-y-5">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1 uppercase">Email Terdaftar</label>
                <input type="email" id="loginEmail" required class="w-full bg-slate-900/60 border border-slate-700 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-cyan-500 transition" placeholder="nama@email.com">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1 uppercase">Password</label>
                <input type="password" id="loginPassword" required class="w-full bg-slate-900/60 border border-slate-700 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-cyan-500 transition" placeholder="••••••••">
            </div>

            <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3.5 rounded-lg transition shadow-[0_0_15px_rgba(6,182,212,0.4)] text-sm uppercase tracking-wider mt-2">
                MASUK KE PANEL
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-400">
            Belum punya akun? <a href="register-user.html" class="text-cyan-400 hover:underline font-bold">Daftar di sini</a>
        </div>
    </div>

    <script>
        document.getElementById('loginUserForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            let users = JSON.parse(localStorage.getItem('db_users')) || [];
            let foundUser = users.find(u => u.email.toLowerCase() === email.toLowerCase() && u.password === password);

            let notifBox = document.getElementById('bannedNotification');
            let notifText = document.getElementById('bannedText');

            if (!foundUser) {
                notifBox.classList.remove('hidden');
                notifText.innerText = "Email atau password salah, atau akun tidak ditemukan!";
                return;
            }

            if (foundUser.status === 'pending') {
                notifBox.classList.remove('hidden');
                notifText.innerText = "Akun Anda masih dalam antrean verifikasi (Pending). Harap tunggu Administrator melakukan ACC.";
                return;
            }

            // CEK KUNCI / BANNED OLEH ADMIN
            if (foundUser.isLocked === true) {
                notifBox.classList.remove('hidden');
                notifText.innerText = "Maaf akun anda untuk saat ini di banned oleh sistem kami silahkan hubungi pusat layanan panel eko !";
                return; // Mencegah proses login sepenuhnya
            }

            if (foundUser.status === 'active') {
                localStorage.setItem('current_user', JSON.stringify(foundUser));
                window.location.href = 'index.html';
            } else {
                notifBox.classList.remove('hidden');
                notifText.innerText = "Akses akun ditolak atau diblokir oleh Administrator.";
            }
        });
    </script>
</body>
</html>
