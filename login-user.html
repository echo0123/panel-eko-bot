<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Member | Panel Eko</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(6, 182, 212, 0.2);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-4">

    <div class="glass-card w-full max-w-md p-8 rounded-2xl relative overflow-hidden">
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-cyan-600 rounded-full filter blur-[60px] opacity-20 pointer-events-none"></div>

        <div class="text-center mb-8">
            <h2 class="text-2xl font-black text-white tracking-wider">MEMBER LOGIN</h2>
            <p class="text-xs text-cyan-400 mt-1 uppercase tracking-widest">Panel Eko User Portal</p>
        </div>

        <form id="loginUserForm" class="space-y-5">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1 uppercase">Email Terdaftar</label>
                <input type="email" id="loginEmail" required class="w-full bg-slate-900/60 border border-slate-700 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-cyan-500 transition" placeholder="nama@email.com">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1 uppercase">Password</label>
                <input type="password" id="loginPassword" required class="w-full bg-slate-900/60 border border-slate-700 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-cyan-500 transition" placeholder="••••••••">
            </div>

            <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3.5 rounded-lg transition shadow-[0_0_15px_rgba(6,182,212,0.4)] text-sm uppercase tracking-wider mt-2">
                MASUK KE PANEL
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-400">
            Belum punya akun? <a href="register-user.html" class="text-cyan-400 hover:underline font-bold">Daftar di sini</a>
        </div>
    </div>

    <script>
        // Pastikan saat halaman login dibuka, sesi lama yang tidak sah dibersihkan
        if (localStorage.getItem('current_user')) {
            let session = JSON.parse(localStorage.getItem('current_user'));
            if (!session.email || !session.status) {
                localStorage.removeItem('current_user');
            }
        }

        document.getElementById('loginUserForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            let users = JSON.parse(localStorage.getItem('db_users')) || [];
            let foundUser = users.find(u => u.email === email && u.password === password);

            if (!foundUser) {
                alert('Email atau password salah, atau akun belum terdaftar!');
                return;
            }

            if (foundUser.status === 'pending') {
                alert('Akun Anda masih dalam antrean verifikasi (Pending). Harap tunggu Administrator melakukan ACC di halaman Admin.');
                return;
            }

            if (foundUser.status === 'active') {
                // Simpan data user aktif secara lengkap ke sesi
                localStorage.setItem('current_user', JSON.stringify(foundUser));
                window.location.href = 'index.html'; // Masuk ke User Dashboard dengan aman
            } else {
                alert('Akses akun ditolak atau diblokir oleh Administrator.');
            }
        });
    </script>
</body>
</html>
