<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Login - Panel Eko Bot</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #161b22; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 100%; max-width: 400px; border: 1px solid #30363d; }
        h2 { text-align: center; color: #58a6ff; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; }
        input { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 11px; background: #1f6feb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #388bfd; }
        .alert { background: rgba(248, 81, 73, 0.1); border: 1px solid #f85149; color: #f85149; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; text-align: center; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>MEMBER LOGIN</h2>
        <div id="loginAlert" class="alert"></div>
        <form id="loginForm">
            <div class="form-group">
                <label>Email Terdaftar</label>
                <input type="email" id="loginEmail" required placeholder="email@gmail.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" required placeholder="********">
            </div>
            <button type="submit">Masuk ke Panel</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB-40LEvhNDOT73mPYYxgIW7fJR4IMfqXU",
            authDomain: "panelekodb.firebaseapp.com",
            projectId: "panelekodb",
            storageBucket: "panelekodb.firebasestorage.app",
            messagingSenderId: "1047356348440",
            appId: "1:1047356348440:web:804cbf2239f07ec8aa0b6d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const alertEl = document.getElementById('loginAlert');

            try {
                const q = query(collection(db, "users"), where("email", "==", email));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    alertEl.style.display = "block";
                    alertEl.innerHTML = "Email tidak ditemukan! Silakan daftar terlebih dahulu.";
                    return;
                }

                let userData = null;
                querySnapshot.forEach((doc) => {
                    userData = doc.data();
                });

                if (userData.password !== password) {
                    alertEl.style.display = "block";
                    alertEl.innerHTML = "Password salah!";
                    return;
                }

                if (userData.status !== "active") {
                    alertEl.style.display = "block";
                    alertEl.innerHTML = "Akun Anda masih dalam antrean verifikasi (PENDING). Harap tunggu Administrator melakukan ACC.";
                    return;
                }

                alertEl.style.display = "none";
                alert("Login berhasil! Selamat datang, " + userData.name);
                // Redirect ke halaman panel user jika ada
            } catch (error) {
                alertEl.style.display = "block";
                alertEl.innerHTML = "Terjadi kesalahan: " + error.message;
            }
        });
    </script>
</body>
</html>
