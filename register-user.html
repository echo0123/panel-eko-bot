<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun | Panel Eko</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(6, 182, 212, 0.2);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-4">

    <div class="glass-card w-full max-w-md p-8 rounded-2xl relative overflow-hidden">
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-cyan-600 rounded-full filter blur-[60px] opacity-20 pointer-events-none"></div>

        <div class="text-center mb-8">
            <h2 class="text-2xl font-black text-white tracking-wider">REGISTRASI AKUN</h2>
            <p class="text-xs text-cyan-400 mt-1 uppercase tracking-widest">Panel Eko User Portal</p>
        </div>

        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1 uppercase">Nama Lengkap</label>
                <input type="text" id="regName" required class="w-full bg-slate-900/60 border border-slate-700 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-cyan-500 transition" placeholder="Cth: Eko Saputro">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1 uppercase">Email Aktif</label>
                <input type="email" id="regEmail" required class="w-full bg-slate-900/60 border border-slate-700 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-cyan-500 transition" placeholder="nama@email.com">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1 uppercase">Password</label>
                <input type="password" id="regPassword" required class="w-full bg-slate-900/60 border border-slate-700 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-cyan-500 transition" placeholder="••••••••">
            </div>

            <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3.5 rounded-lg transition shadow-[0_0_15px_rgba(6,182,212,0.4)] text-sm uppercase tracking-wider mt-2">
                DAFTAR SEKARANG
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-400">
            Sudah punya akun? <a href="login-user.html" class="text-cyan-400 hover:underline font-bold">Login di sini</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;

            let users = JSON.parse(localStorage.getItem('db_users')) || [];

            let existing = users.find(u => u.email === email);
            if (existing) {
                alert('Email ini sudah terdaftar! Silakan gunakan email lain atau langsung login.');
                return;
            }

            users.push({
                name: name,
                email: email,
                password: password,
                status: 'pending',
                customUiAllowed: false,
                customUiExpiry: null,
                jenisLayananAktif: null
            });

            localStorage.setItem('db_users', JSON.stringify(users));
            alert('Registrasi Berhasil! Akun Anda sedang menunggu persetujuan (ACC) dari Administrator.');
            window.location.href = 'login-user.html';
        });
    </script>
</body>
</html>
