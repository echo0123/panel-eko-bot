<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Member - Panel Eko Bot</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #161b22; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 100%; max-width: 400px; border: 1px solid #30363d; }
        h2 { text-align: center; color: #58a6ff; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; }
        input { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 11px; background: #238636; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #2ea043; }
        .msg { margin-top: 15px; text-align: center; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Pendaftaran Member</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="regName" required placeholder="Masukkan nama Anda">
            </div>
            <div class="form-group">
                <label>Email Terdaftar</label>
                <input type="email" id="regEmail" required placeholder="email@gmail.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" required placeholder="Minimal 6 karakter">
            </div>
            <button type="submit">Daftar Sekarang</button>
        </form>
        <div id="regMsg" class="msg"></div>
    </div>

    <!-- Script Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB-40LEvhNDOT73mPYYxgIW7fJR4IMfqXU",
            authDomain: "panelekodb.firebaseapp.com",
            projectId: "panelekodb",
            storageBucket: "panelekodb.firebasestorage.app",
            messagingSenderId: "1047356348440",
            appId: "1:1047356348440:web:804cbf2239f07ec8aa0b6d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const msgEl = document.getElementById('regMsg');

            try {
                await addDoc(collection(db, "users"), {
                    name: name,
                    email: email,
                    password: password,
                    status: "pending",
                    createdAt: new Date().toISOString()
                });
                msgEl.style.color = "#3fb950";
                msgEl.innerHTML = "Pendaftaran berhasil! Akun Anda menunggu verifikasi Admin.";
                document.getElementById('registerForm').reset();
            } catch (error) {
                msgEl.style.color = "#f85149";
                msgEl.innerHTML = "Gagal mendaftar: " + error.message;
            }
        });
    </script>
</body>
</html>
